options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/printfield-ecommerce'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/printfield-ecommerce'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'printfield-ecommerce'
      - '--image'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/printfield-ecommerce'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '5'
      - '--set-env-vars'
      - 'NODE_ENV=production,JWT_SECRET=${_JWT_SECRET},DATA_ENC_KEY=${_DATA_ENC_KEY},ADMIN_TOKEN=${_ADMIN_TOKEN},ADMIN_EMAIL=${_ADMIN_EMAIL}'

substitutions:
  _JWT_SECRET: ''
  _DATA_ENC_KEY: ''
  _ADMIN_TOKEN: ''
  _ADMIN_EMAIL: aryan@printfield.in

images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/printfield-ecommerce'
